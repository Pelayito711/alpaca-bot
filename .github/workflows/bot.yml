name: Bot de Trading Auto-Correctivo de Bitcoin (24/7)
on:
  schedule:
    # 1. Ejecutar cada 5 minutos las 24 horas del día, los 7 días de la semana
    - cron: '*/5 * * * *'
    # 2. Ejecutar la auto-optimización cada domingo a las 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código del Repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ejecutar Bot de Bitcoin 24/7
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL || 'https://api.alpaca.markets' }}
        run: python btc_bot.py
