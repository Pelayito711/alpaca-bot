name: Bot de Trading Auto-Correctivo de Bitcoin
on:
  schedule:
    # Ejecutar el bot cada 5 minutos durante la sesión de Londres (07:00 - 15:00 UTC)
    - cron: '*/5 7-15 * * *'
    # Ejecutar la auto-optimización cada domingo a las 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Permite ejecutar el bot manualmente desde GitHub
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código del Repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ejecutar Bot Operador Diario o Módulo de Optimización
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 0 * * 0" ]; then
            echo "Iniciando proceso de auto-optimización semanal..."
            python optimize_btc.py
            
            git config --global user.name 'Github Bot'
            git config --global user.email 'bot@github.com'
            git add config.json
            git diff-index --quiet HEAD || git commit -m "Auto-optimización: Parámetros actualizados"
            git push
          else
            echo "Iniciando ejecución diaria del bot de Bitcoin..."
            python btc_bot.py
          fi
